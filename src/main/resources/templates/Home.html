<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Lovers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: rgb(209, 233, 246);
            --warm-yellow: rgb(246, 234, 203);
            --soft-orange: rgb(241, 211, 206);
            --gentle-pink: rgb(238, 202, 213);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--warm-yellow) 50%, var(--soft-orange) 100%);
            min-height: 100vh;
            padding: 20px;
            animation: backgroundShift 10s ease-in-out infinite alternate;
        }

        @keyframes backgroundShift {
            0% { background: linear-gradient(135deg, var(--primary-blue) 0%, var(--warm-yellow) 50%, var(--soft-orange) 100%); }
            100% { background: linear-gradient(135deg, var(--soft-orange) 0%, var(--gentle-pink) 50%, var(--primary-blue) 100%); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            animation: containerFloat 6s ease-in-out infinite;
        }

        @keyframes containerFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            text-align: center;
            font-size: 3.5em;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #4a90e2, #7b68ee, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGlow 3s ease-in-out infinite alternate;
            position: relative;
        }

        @keyframes titleGlow {
            0% { filter: drop-shadow(0 0 5px rgba(74, 144, 226, 0.3)); }
            100% { filter: drop-shadow(0 0 20px rgba(123, 104, 238, 0.6)); }
        }

        h1::after {
            content: '📚';
            position: absolute;
            right: -60px;
            top: 50%;
            transform: translateY(-50%);
            animation: bookBounce 2s ease-in-out infinite;
        }

        @keyframes bookBounce {
            0%, 100% { transform: translateY(-50%) rotate(0deg); }
            50% { transform: translateY(-60%) rotate(10deg); }
        }

        .search-form-container {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-form-container input[type="text"] {
            padding: 15px 20px;
            width: 400px;
            max-width: 100%;
            border: 3px solid var(--gentle-pink);
            border-radius: 50px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            outline: none;
        }

        .search-form-container input[type="text"]:focus {
            border-color: var(--soft-orange);
            box-shadow: 0 0 20px rgba(241, 211, 206, 0.5);
            transform: scale(1.02);
        }

        .search-form-container button {
            padding: 15px 30px;
            background: linear-gradient(45deg, var(--gentle-pink), var(--soft-orange));
            color: #333;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .search-form-container button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            background: linear-gradient(45deg, var(--soft-orange), var(--warm-yellow));
        }

        article {
            background: rgba(255, 255, 255, 0.8);
            margin: 30px 0;
            padding: 30px;
            border-radius: 15px;
            border-left: 5px solid var(--gentle-pink);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        article::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.8s ease;
        }

        article:hover::before {
            left: 100%;
        }

        article:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            border-left-color: var(--soft-orange);
        }

        article h1 {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: #333;
            text-decoration: none;
            background: none;
            -webkit-text-fill-color: #333;
            animation: none;
        }

        article h1::after {
            display: none;
        }

        article a {
            text-decoration: none;
            color: inherit;
        }

        article a:hover h1 {
            color: #4a90e2;
            transition: color 0.3s ease;
        }

        article p {
            color: #666;
            margin-bottom: 15px;
            font-style: italic;
        }

        .no-posts {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            color: #666;
            font-size: 1.2em;
        }

        .pagination-container {
            margin-top: 50px;
            text-align: center;
        }

        .pagination {
            display: inline-flex;
            gap: 10px;
            padding: 0;
            margin: 20px 0;
            list-style: none;
        }

        .pagination li a, .pagination li span {
            display: block;
            padding: 12px 18px;
            color: #333;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--primary-blue);
            border-radius: 50px;
            transition: all 0.3s ease;
            min-width: 50px;
            text-align: center;
        }

        .pagination li a:hover {
            background: var(--gentle-pink);
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .pagination li.active span {
            background: linear-gradient(45deg, var(--soft-orange), var(--gentle-pink));
            color: #333;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .pagination li.disabled span {
            background: #f8f9fa;
            color: #ccc;
            cursor: not-allowed;
            border-color: #ddd;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        article {
            animation: fadeInUp 0.6s ease forwards;
        }

        article:nth-child(even) {
            animation-delay: 0.1s;
        }

        article:nth-child(odd) {
            animation-delay: 0.2s;
        }

        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #fff, transparent);
            border-radius: 50%;
            animation: sparkle 2s linear infinite;
        }

        @keyframes sparkle {
            0% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1) rotate(180deg);
            }
            100% {
                opacity: 0;
                transform: scale(0) rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 20px;
            }
            
            h1 {
                font-size: 2.5em;
            }
            
            .search-form-container input[type="text"] {
                width: 100%;
                margin-bottom: 10px;
            }
            
            .pagination {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Book Lovers!</h1>
        
        <div class="search-form-container">
            <form th:action="@{/}" method="get">
                <input type="text" name="keyword" th:value="${param.keyword}" placeholder="🔍 Search by title..."/>
                <button type="submit">Search</button>
            </form>
        </div>
        
        <div th:if="${postPage.hasContent()}">
            <article th:each="post, iterStat : ${postPage.content}" th:style="'animation-delay: ' + ${iterStat.index * 0.1} + 's'">
                <a th:href="@{/post/{id}(id=${post.id})}">
                    <h1 th:text="${post.title}">Post Title</h1>
                </a>
                <p><em>📅 Posted on <span th:text="${#temporals.format(post.createdAt, 'MMMM dd, yyyy')}">January 01, 2023</span></em></p>
                <div th:utext="${post.content}">
                    <p>This is where the full content of the blog post will appear.</p>
                </div>
            </article>
        </div>
        
        <div th:if="${!postPage.hasContent()}" class="no-posts">
            <p>📖 No posts have been published yet. Stay tuned for amazing book content!</p>
        </div>

        <nav aria-label="Pagination" th:if="${postPage.totalPages > 1}" class="pagination-container">
            <ul class="pagination">
                <li th:classappend="${postPage.isFirst()} ? 'disabled' : ''">
                    <a th:href="${!postPage.isFirst()} ? @{/(page=${postPage.number - 1}, keyword=${keyword})} : '#'">
                        « Previous
                    </a>
                </li>

                <li th:each="pageNum : ${#numbers.sequence(0, postPage.totalPages - 1)}"
                    th:classappend="${pageNum == postPage.number} ? 'active' : ''">
                    <a th:href="@{/(page=${pageNum}, keyword=${keyword})}" th:text="${pageNum + 1}"></a>
                </li>

                <li th:classappend="${postPage.isLast()} ? 'disabled' : ''">
                    <a th:href="${!postPage.isLast()} ? @{/(page=${postPage.number + 1}, keyword=${keyword})} : '#'">
                        Next »
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <script>
        // Add sparkle effects
        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            document.body.appendChild(sparkle);
            
            setTimeout(() => {
                sparkle.remove();
            }, 2000);
        }
        
        setInterval(createSparkle, 3000);
    </script>
</body>
</html>
