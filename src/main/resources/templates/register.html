<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Book Lovers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: rgb(209, 233, 246);
            --warm-yellow: rgb(246, 234, 203);
            --soft-orange: rgb(241, 211, 206);
            --gentle-pink: rgb(238, 202, 213);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--warm-yellow) 0%, var(--soft-orange) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--primary-blue) 30%, transparent 70%);
            animation: backgroundFloat 10s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes backgroundFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-20px, 30px) rotate(120deg); }
            66% { transform: translate(30px, -20px) rotate(240deg); }
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 60px 50px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            max-width: 500px;
            animation: registerSlide 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        @keyframes registerSlide {
            from {
                opacity: 0;
                transform: translateY(100px) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .register-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--gentle-pink), var(--soft-orange), var(--warm-yellow), var(--primary-blue));
            border-radius: 32px;
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite alternate;
        }

        @keyframes borderGlow {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .register-icon {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .register-icon::before {
            content: '📖';
            font-size: 4em;
            background: linear-gradient(135deg, var(--warm-yellow), var(--gentle-pink));
            padding: 20px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            animation: iconPulse 2s ease-in-out infinite alternate;
        }

        @keyframes iconPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.8em;
            background: linear-gradient(45deg, #e74c3c, #f39c12, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            animation: titleShimmer 3s ease-in-out infinite;
        }

        @keyframes titleShimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .error-message {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            color: white;
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 500;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.3);
            animation: errorShake 0.5s ease;
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .form-group {
            margin-bottom: 30px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-weight: 700;
            color: #333;
            font-size: 1.2em;
            position: relative;
        }

        label::before {
            content: attr(data-icon);
            margin-right: 10px;
            font-size: 1.1em;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 20px 25px;
            border: 3px solid var(--primary-blue);
            border-radius: 25px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            outline: none;
            position: relative;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--gentle-pink);
            box-shadow: 0 0 0 6px rgba(238, 202, 213, 0.3);
            transform: translateY(-3px) scale(1.02);
            background: white;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3em;
            color: var(--gentle-pink);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        input:focus + .input-icon {
            color: var(--soft-orange);
            transform: translateY(-50%) scale(1.3) rotate(10deg);
        }

        .submit-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--gentle-pink), var(--soft-orange), var(--warm-yellow));
            background-size: 300% 300%;
            color: #333;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(238, 202, 213, 0.5);
            position: relative;
            overflow: hidden;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transition: all 0.6s ease;
            transform: translate(-50%, -50%);
        }

        .submit-btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .submit-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(238, 202, 213, 0.7);
        }

        .submit-btn:active {
            transform: translateY(-2px);
        }

        .login-link {
            text-align: center;
            margin-top: 35px;
            padding: 25px;
            background: rgba(209, 233, 246, 0.3);
            border-radius: 20px;
            border: 2px dashed var(--primary-blue);
            position: relative;
        }

        .login-link::before {
            content: '🔐';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 5px 10px;
            border-radius: 50%;
            font-size: 1.5em;
        }

        .login-link a {
            color: #4a90e2;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
            position: relative;
            display: inline-block;
        }

        .login-link a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            bottom: -5px;
            left: 0;
            background: linear-gradient(45deg, #4a90e2, #7b68ee);
            transition: width 0.4s ease;
            border-radius: 2px;
        }

        .login-link a:hover::after {
            width: 100%;
        }

        .login-link a:hover {
            color: #7b68ee;
            transform: scale(1.08);
        }

        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .floating-book {
            position: absolute;
            font-size: 2em;
            opacity: 0.1;
            animation: floatBooks 8s ease-in-out infinite;
        }

        .floating-book:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
        .floating-book:nth-child(2) { top: 60%; left: 85%; animation-delay: 2s; }
        .floating-book:nth-child(3) { top: 80%; left: 20%; animation-delay: 4s; }
        .floating-book:nth-child(4) { top: 30%; left: 70%; animation-delay: 6s; }

        @keyframes floatBooks {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.1; }
            50% { transform: translateY(-30px) rotate(180deg); opacity: 0.3; }
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 40px 30px;
                margin: 10px;
            }
            
            h1 {
                font-size: 2.2em;
            }
            
            input[type="text"], input[type="password"] {
                padding: 16px 20px;
            }
        }

        .success-animation {
            animation: successBounce 0.6s ease;
        }

        @keyframes successBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="floating-elements">
        <div class="floating-book">📚</div>
        <div class="floating-book">📖</div>
        <div class="floating-book">📝</div>
        <div class="floating-book">📓</div>
    </div>

    <div class="register-container">
        <div class="register-icon"></div>
        
        <h1>Join Our Community!</h1>

        <div th:if="${registrationError}" class="error-message">
            <p th:text="${registrationError}"></p>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="form-group">
                <label for="username" data-icon="👤">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" th:field="*{username}" required autofocus placeholder="Choose your unique username">
                    <div class="input-icon">✨</div>
                </div>
            </div>

            <div class="form-group">
                <label for="password" data-icon="🔐">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" th:field="*{password}" required placeholder="Create a secure password">
                    <div class="input-icon">🔑</div>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                Create Account & Start Reading! 📚
            </button>
        </form>

        <div class="login-link">
            <p>📖 Already part of our book family? <a th:href="@{/login}">Sign in here</a></p>
        </div>
    </div>

    <script>
        // Add success animation on form submission
        document.querySelector('form').addEventListener('submit', function() {
            this.classList.add('success-animation');
        });

        // Add floating animation to input focus
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
