<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Manage Posts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: rgb(209, 233, 246);
            --warm-yellow: rgb(246, 234, 203);
            --soft-orange: rgb(241, 211, 206);
            --gentle-pink: rgb(238, 202, 213);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--warm-yellow) 50%, var(--soft-orange) 100%);
            min-height: 100vh;
            padding: 30px;
            animation: backgroundShift 12s ease-in-out infinite alternate;
        }

        @keyframes backgroundShift {
            0% { background: linear-gradient(135deg, var(--primary-blue) 0%, var(--warm-yellow) 50%, var(--soft-orange) 100%); }
            100% { background: linear-gradient(135deg, var(--gentle-pink) 0%, var(--soft-orange) 50%, var(--primary-blue) 100%); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            animation: containerFadeIn 1s ease;
        }

        @keyframes containerFadeIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            font-size: 3em;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #e74c3c, #f39c12, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            animation: titlePulse 3s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(231, 76, 60, 0.3)); }
            50% { filter: drop-shadow(0 0 20px rgba(243, 156, 18, 0.6)); }
        }

        h1::before {
            content: '⚡';
            margin-right: 15px;
            animation: iconSpin 4s linear infinite;
        }

        @keyframes iconSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .btn-create {
            background: linear-gradient(135deg, var(--gentle-pink), var(--soft-orange));
            color: #333;
            text-decoration: none;
            padding: 18px 35px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(238, 202, 213, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-create::before {
            content: '✨';
            margin-right: 10px;
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .btn-create::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: all 0.6s ease;
            transform: translate(-50%, -50%);
        }

        .btn-create:hover::after {
            width: 300px;
            height: 300px;
        }

        .btn-create:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(238, 202, 213, 0.6);
            background: linear-gradient(135deg, var(--soft-orange), var(--warm-yellow));
        }

        .table-container {
            overflow-x: auto;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            animation: tableSlide 1s ease 0.5s both;
        }

        @keyframes tableSlide {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 20px;
            overflow: hidden;
        }

        thead {
            background: linear-gradient(135deg, var(--primary-blue), var(--gentle-pink));
            position: relative;
        }

        thead::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: headerShine 3s ease-in-out infinite;
        }

        @keyframes headerShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        th {
            padding: 20px 15px;
            text-align: left;
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
            position: relative;
            z-index: 1;
        }

        th:first-child { border-top-left-radius: 20px; }
        th:last-child { border-top-right-radius: 20px; }

        tbody tr {
            transition: all 0.3s ease;
            position: relative;
        }

        tbody tr:nth-child(even) {
            background: rgba(246, 234, 203, 0.3);
        }

        tbody tr:nth-child(odd) {
            background: rgba(241, 211, 206, 0.2);
        }

        tbody tr:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            background: rgba(238, 202, 213, 0.4);
            z-index: 10;
        }

        td {
            padding: 18px 15px;
            border: none;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .btn {
            text-decoration: none;
            padding: 10px 18px;
            margin-right: 8px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            transition: all 0.4s ease;
            transform: translate(-50%, -50%);
        }

        .btn:hover::before {
            width: 100px;
            height: 100px;
        }

        .btn-edit {
            background: linear-gradient(135deg, #ffc107, #ffb300);
            color: #333;
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
        }

        .btn-edit::before {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-edit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 193, 7, 0.5);
        }

        .btn-delete {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        .btn-delete::before {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-delete:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(220, 53, 69, 0.5);
        }

        .delete-form {
            display: inline;
        }

        .no-posts {
            text-align: center;
            padding: 60px 40px;
            background: rgba(246, 234, 203, 0.3);
            border-radius: 20px;
            border: 3px dashed var(--warm-yellow);
            color: #666;
            font-size: 1.3em;
            animation: noPosts 2s ease-in-out infinite alternate;
        }

        @keyframes noPosts {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        .no-posts::before {
            content: '📝';
            font-size: 3em;
            display: block;
            margin-bottom: 20px;
            animation: noPostsIcon 3s ease-in-out infinite;
        }

        @keyframes noPostsIcon {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(10deg); }
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .stat-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #e74c3c;
            display: block;
            animation: countUp 2s ease;
        }

        @keyframes countUp {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            h1 {
                font-size: 2.2em;
            }
            
            .table-container {
                border-radius: 15px;
            }
            
            table {
                font-size: 0.9em;
            }
            
            th, td {
                padding: 12px 8px;
            }
            
            .btn {
                padding: 8px 12px;
                font-size: 12px;
                margin-right: 5px;
                margin-bottom: 5px;
            }
            
            .stats-bar {
                gap: 15px;
            }
            
            .stat-item {
                padding: 15px 20px;
                min-width: 120px;
            }
        }

        .fade-in {
            animation: fadeInRow 0.6s ease forwards;
        }

        @keyframes fadeInRow {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Post Management Dashboard</h1>

        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-number" th:text="${posts.size()}">0</span>
                <span class="stat-label">Total Posts</span>
            </div>
            <div class="stat-item">
                <span class="stat-number">📚</span>
                <span class="stat-label">Book Content</span>
            </div>
            <div class="stat-item">
                <span class="stat-number">✨</span>
                <span class="stat-label">Active</span>
            </div>
        </div>

        <a th:href="@{/admin/posts/new}" class="btn-create">Create New Post</a>

        <div th:if="${!posts.isEmpty()}" class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>📋 ID</th>
                        <th>📖 Title</th>
                        <th>📅 Created At</th>
                        <th>⚙️ Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="post, iterStat : ${posts}" class="fade-in" th:style="'animation-delay: ' + ${iterStat.index * 0.1} + 's'">
                        <td th:text="${post.id}">1</td>
                        <td th:text="${post.title}">My First Post</td>
                        <td th:text="${#temporals.format(post.createdAt, 'dd-MMM-yyyy HH:mm')}">01-Jan-2023 10:30</td>
                        <td>
                            <a th:href="@{/admin/posts/edit/{id}(id=${post.id})}" class="btn btn-edit">
                                ✏️ Edit
                            </a>
                            <form th:action="@{/admin/posts/delete/{id}(id=${post.id})}" method="post" class="delete-form">
                                <button type="submit" class="btn btn-delete" onclick="return confirm('⚠️ Are you sure you want to delete this post? This action cannot be undone!');">
                                    🗑️ Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${posts.isEmpty()}" class="no-posts">
            <p>No posts found yet! 📚 Ready to create some amazing book content?</p>
        </div>
    </div>

    <script>
        // Add hover effects and animations
        document.addEventListener('DOMContentLoaded', function() {
            // Animate stat numbers
            const statNumbers = document.querySelectorAll('.stat-number');
            statNumbers.forEach((stat, index) => {
                if (!isNaN(stat.textContent)) {
                    const finalValue = parseInt(stat.textContent);
                    let currentValue = 0;
                    const increment = Math.ceil(finalValue / 30);
                    
                    const timer = setInterval(() => {
                        currentValue += increment;
                        if (currentValue >= finalValue) {
                            currentValue = finalValue;
                            clearInterval(timer);
                        }
                        stat.textContent = currentValue;
                    }, 50);
                }
            });

            // Add click animation to buttons
            document.querySelectorAll('.btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 150);
                });
            });
        });
    </script>
</body>
</html>
